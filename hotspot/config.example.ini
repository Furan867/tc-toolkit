; hotspot 默认配置示例（spec §10）。复制为 config.ini 后按本机改；
; config.ini 是运行时配置，不入库。
;
; 值用 JSON 编码：字符串带引号，true/false 裸写，数字裸写。
; 相对路径相对仓库根（tc-toolkit/）。

[game]
exe_name = "Turing Complete.exe"

[sampler]
backend = "etw"          ; etw | suspend
interval_ms = 1
window_sec = 10
suspend_probe_rounds = 40

[etw]
session_name = "hotspot"
keep_etl = false

[lock]
dir = "work/tmp/locks"

[paths]
workspace = "hotspot/workspace"
artifacts = "work/hook"

[freq]
command = "python tools/read_freq.py --samples 1"
timeout_sec = 5.0
