# hotspot 默认配置示例（spec §10）。复制为 config.toml 后按本机改；
# config.toml 是运行时配置，不入库。

[game]
exe_name = "Turing Complete.exe"

[sampler]
backend = "etw"          # etw | suspend
interval_ms = 1
window_sec = 10
suspend_probe_rounds = 40

[etw]
session_name = "hotspot"

[lock]
dir = "work/tmp/locks"

[paths]
workspace = "hotspot/workspace"
artifacts = "work/hook"

[freq]
command = "python tools/read_freq.py --samples 1"
timeout_sec = 5.0
