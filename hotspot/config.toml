# hotspot 的唯一配置（spec §10）。键名与默认值都在设计文档里定过：
# 改这里的值等于改默认值，所以每一项都显式写出，不做"只写改过的"。
#
# 相对路径相对仓库根（tc-toolkit/）：hotspot-consumer 从仓库根启动。

[game]
exe_name = "Turing Complete.exe"

[sampler]
backend = "suspend"      # 当前只有 suspend；etw 后端未实现
interval_ms = 1          # etw 量纲按 100 ns 折算；suspend 就是内部节拍
window_sec = 10
suspend_probe_rounds = 40

[etw]
session_name = "hotspot"
keep_etl = false         # ETL 解析后默认删除（几十 MB/次）

[lock]
dir = "work/tmp/locks"   # game.lock：采样期间独占游戏

[paths]
workspace = "hotspot/workspace"
artifacts = "work/hook"  # 只读产物库（hook 落盘的 .bin）

[freq]
command = "python tools/read_freq.py --samples 1"
timeout_sec = 5.0
