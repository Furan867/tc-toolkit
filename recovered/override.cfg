; ==============================================================================
; Turing Complete - UI缩放/分辨率覆盖配置
; Godot 3.4.2 支持 override.cfg，放在 exe 旁边即可覆盖项目设置
;
; 当前方案：将内部分辨率设为 1920x1080，然后拉伸到 4K 显示
; 这相当于 2x UI 缩放（3840/1920 = 2, 2160/1080 = 2）
;
; 如果想用其他缩放比例，修改下面的 test_width/test_height：
;   1.5x 缩放 → test_width=2560, test_height=1440
;   2.0x 缩放 → test_width=1920, test_height=1080  (当前设置)
;   2.5x 缩放 → test_width=1536, test_height=864
;   3.0x 缩放 → test_width=1280, test_height=720
; ==============================================================================

[display]

; --- 视口拉伸模式 ---
; "viewport" = 始终以 test_width x test_height 渲染，然后拉伸到窗口大小
; "2d"       = 2D元素随窗口缩放
; "disabled" = 无拉伸（默认，导致4K下UI极小）
window/stretch/mode="viewport"

; --- 内部渲染分辨率 (1080p) ---
; 游戏会以此为基准分辨率渲染所有内容，然后拉伸到实际显示尺寸
window/size/test_width=1920
window/size/test_height=1080

; --- 宽高比处理 ---
; "keep"        = 保持比例，可能留黑边
; "keep_width"  = 以宽度为基准
; "keep_height" = 以高度为基准
; "ignore"      = 完全拉伸（会变形）
; "expand"      = 扩展以适应
window/stretch/aspect="keep"

; --- 收缩处理 ---
; 当窗口小于 test_width/test_height 时的缩放因子
; 1.0 = 不缩小
window/stretch/shrink=1.0
